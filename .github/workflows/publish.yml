name: Publish the Gazette

on:
  schedule:
    - cron: "17 12 * * 2"   # Tuesdays ~8am ET: final issue after Monday Night Football
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write   # to save each week's issue back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pull the league from ESPN (needs the ESPN_S2 and ESPN_SWID secrets for a private league).
      - name: Update from ESPN
        if: github.event_name != 'push'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python3 scripts/update.py

      # Keep every issue in the repo, so old weeks stay even if ESPN changes.
      - name: Save issues
        if: github.event_name != 'push'
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Gazette update $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
