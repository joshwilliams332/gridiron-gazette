<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standings · The Gridiron Gazette</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%238e1c1c%22/%3E%3Ctext x=%2216%22 y=%2224%22 font-family=%22Georgia%22 font-weight=%22900%22 font-size=%2222%22 text-anchor=%22middle%22 fill=%22%23f6f1e7%22%3EG%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
  <script>try { const t = localStorage.getItem("gz-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="assets/gazette.css">
</head>
<body>
  <main><p class="muted ui">Loading…</p></main>
  <script src="assets/gazette.js"></script>
  <script>
    GZ.start(league => `Standings through Week ${league.weeks[league.weeks.length - 1] ?? 0}`, async (main, league, team) => {
      const rows = league.standings;
      main.innerHTML = `
        <h2 class="section-title" style="margin-top:24px">Standings</h2>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>#</th><th>Team</th><th class="n">W-L</th><th class="n">PF</th><th class="n">PA</th><th class="n">All-play</th><th class="n">Streak</th><th class="n">Power</th></tr></thead>
          <tbody>${rows.map(r => `<tr class="${r.team === league.my_team ? "me" : ""}">
            <td>${r.rank}</td><td>${teamLink(team, r.team)}</td><td class="n">${record(r)}</td>
            <td class="n">${f2(r.pf)}</td><td class="n">${f2(r.pa)}</td><td class="n">${r.all_w}-${r.all_l}</td>
            <td class="n">${esc(r.streak)}</td><td class="n">${r.power_rank}</td></tr>`).join("")}
          </tbody>
        </table>
        </div>
        <p class="muted small ui">All-play: your record if you'd played every team every week. A good all-play record with a bad real record means bad luck.
        PF/PA = points for/against (regular season).</p>`;
    });
  </script>
</body>
</html>
